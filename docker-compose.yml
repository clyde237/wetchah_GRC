version: '3.8'

services:
  grc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wetchah-grc-standalone
    ports:
      - "${PORT:-8085}:8000"
    # Les deux secrets sont lus depuis le .env local (non versionné), jamais
    # écrits ici : ce fichier est suivi par git, toute valeur en dur devient
    # publique. La syntaxe ${VAR:?message} fait échouer `docker compose up`
    # avec un message clair si la variable manque, plutôt que de démarrer avec
    # une clé connue de tous.
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY manquante — ajoutez une clé aléatoire dans wetchah_GRC/.env (voir .env.example)}
      - DATABASE_URL=sqlite:////data/grc.db
      - TENANT_SLUG=demo
      - TENANT_NAME=Hôtel Résidence Villa Boutanga
      - ERP_API_URL=http://host.docker.internal:8081
      - REPORTING_SECRET=${REPORTING_SECRET:?REPORTING_SECRET manquant — reprenez la valeur configurée côté wetchah_erp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grc_data:/data
    restart: unless-stopped

volumes:
  grc_data:
